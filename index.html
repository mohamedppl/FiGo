<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            display: flex;
            border: 1px solid #ccc;
            border-radius: 24px;
            overflow: hidden;
            background: #fff;
        }
        .search-box input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 16px;
        }
        .search-box button {
            padding: 10px 20px;
            border: none;
            background: #4285f4;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .search-box button:hover {
            background: #357ae8;
        }
    </style>
</head>
<body>
    <h1 align="center"><span style="color:red;">F</span>&nbsp;<span style="color:blue">I</span>&nbsp;<span style="color:green">G</span>&nbsp;<span style="color:orange">O</span></h1>
    <form class="search-box" onsubmit="return searchFigo()">
        <input type="text" id="searchQuery" placeholder="ابحث في Figo...">
        <button type="submit">بحث</button>
    </form>
    <script>
        function searchFigo() {
            let query = document.getElementById('searchQuery').value;
            if (query) {
                window.location.href = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
            }
            return false;
        }
    </script>
</body>
</html>
